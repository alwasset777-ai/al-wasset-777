<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فيديو الترحيب – الوسيط 777</title>
<!--
  فيديو ترحيبي لمشتركي تطبيق الوسيط 777 (1080×1920، صيغة الهاتف).
  الصفحة لا تتحرك وحدها: render.mjs يستدعي window.renderAt(t) لكل صورة ثم يجمعها ffmpeg.
  لمعاينتها في المتصفح أضف ?play إلى الرابط.
-->
<style>
@font-face { font-family: 'Cairo'; src: url(fonts/cairo-arabic.woff2) format('woff2'); font-weight: 200 1000;
  unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: 'Cairo'; src: url(fonts/cairo-latin.woff2) format('woff2'); font-weight: 200 1000;
  unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212; }

:root { --coral: #ff6f61; --coral2: #ff9a8b; --cream: #fff8f7; --dark: #241311; --dark2: #3a1f1b; --gold: #ffc56b; --muted: #d9bfbb; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
body { font-family: 'Cairo', sans-serif; color: var(--cream); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: radial-gradient(1200px 900px at 80% 10%, #4a2420 0%, transparent 60%),
              radial-gradient(1000px 900px at 10% 90%, #3b1c19 0%, transparent 60%),
              linear-gradient(160deg, #2c1714 0%, #1c0e0c 100%); }

/* Décor permanent */
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; }
#b1 { width: 520px; height: 520px; background: var(--coral); top: -120px; left: -160px; }
#b2 { width: 420px; height: 420px; background: #b34a3f; bottom: 160px; right: -140px; }
#b3 { width: 300px; height: 300px; background: var(--gold); bottom: -120px; left: 200px; opacity: .15; }
#grid { position: absolute; inset: 0; opacity: .06;
  background-image: linear-gradient(var(--cream) 1px, transparent 1px), linear-gradient(90deg, var(--cream) 1px, transparent 1px);
  background-size: 90px 90px; }
#skyline { position: absolute; bottom: 0; left: 0; width: 1080px; height: 360px; opacity: .22; }
#brandbar { position: absolute; top: 56px; right: 64px; left: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
#brandbar .b { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 30px; }
#brandbar img { width: 64px; height: 64px; border-radius: 16px; }
#brandbar .site { font-size: 24px; color: var(--muted); direction: ltr; font-weight: 700; }
#progress { position: absolute; bottom: 0; right: 0; height: 10px; background: linear-gradient(90deg, var(--gold), var(--coral)); z-index: 6; }

/* Scènes */
.scene { position: absolute; inset: 0; padding: 170px 80px 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; opacity: 0; }
.a { will-change: transform, opacity; }
.kicker { display: inline-flex; align-items: center; gap: 14px; padding: 14px 34px; border-radius: 999px; background: rgba(255,111,97,.16); border: 2px solid rgba(255,111,97,.5); color: var(--coral2); font-weight: 800; font-size: 34px; }
h1 { font-size: 100px; line-height: 1.15; font-weight: 900; }
h2 { font-size: 84px; line-height: 1.2; font-weight: 900; }
h3 { font-size: 52px; line-height: 1.35; font-weight: 800; }
p.lead { font-size: 46px; line-height: 1.6; color: #f3dcd8; font-weight: 600; }
.hl { color: var(--coral); }
.gold { color: var(--gold); }
.sp { height: 40px; }
.sp2 { height: 70px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

.logo-big { width: 340px; height: 340px; border-radius: 80px; box-shadow: 0 40px 120px rgba(255,111,97,.35); }
.ring { position: absolute; border: 4px solid rgba(255,111,97,.45); border-radius: 50%; }

.card { background: rgba(255,248,247,.07); border: 2px solid rgba(255,248,247,.14); border-radius: 44px; padding: 34px 40px; display: flex; align-items: center; gap: 30px; text-align: right; width: 100%; }
.card .ico { flex: none; width: 116px; height: 116px; border-radius: 32px; background: linear-gradient(145deg, var(--coral), #e2554a); display: grid; place-items: center; box-shadow: 0 16px 40px rgba(255,111,97,.3); }
.card .t { font-size: 46px; font-weight: 900; line-height: 1.3; }
.card .s { font-size: 34px; color: var(--muted); font-weight: 600; line-height: 1.45; }
.list { display: flex; flex-direction: column; gap: 26px; width: 100%; }

.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; }
.chip { padding: 26px 44px; border-radius: 999px; background: var(--cream); color: var(--dark); font-size: 46px; font-weight: 900; display: inline-flex; align-items: center; gap: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.chip.alt { background: var(--coral); color: #fff; }

/* Téléphone */
.phone { width: 520px; height: 820px; border-radius: 84px; background: #120807; border: 14px solid #3d2622; box-shadow: 0 50px 140px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.06) inset; position: relative; overflow: hidden; flex: none; }
.phone .notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 170px; height: 40px; background: #000; border-radius: 30px; z-index: 3; }
.phone .scr { position: absolute; inset: 0; background: var(--cream); color: var(--dark); padding: 84px 30px 30px; display: flex; flex-direction: column; gap: 22px; text-align: right; }
.scr .bar { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid #f0e4e2; border-radius: 26px; padding: 18px 22px; font-size: 26px; font-weight: 700; color: #7a5c58; }
.scr .pc { background: #fff; border-radius: 30px; overflow: hidden; border: 2px solid #f0e4e2; box-shadow: 0 10px 26px rgba(40,23,21,.08); }
.scr .pc .img { height: 190px; position: relative; }
.scr .pc .info { padding: 16px 22px; }
.scr .pc .pr { font-size: 32px; font-weight: 900; color: var(--coral); }
.scr .pc .nm { font-size: 24px; font-weight: 700; color: #5a4340; }
.scr .badge { position: absolute; top: 16px; right: 16px; background: var(--coral); color: #fff; font-size: 20px; font-weight: 800; padding: 4px 16px; border-radius: 999px; }
.scr .heart { position: absolute; top: 14px; left: 14px; width: 56px; height: 56px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.scr .btn { border-radius: 24px; padding: 20px; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 12px; }
.bubble { max-width: 86%; padding: 18px 24px; border-radius: 30px; font-size: 26px; font-weight: 700; line-height: 1.5; }
.bubble.me { align-self: flex-start; background: var(--coral); color: #fff; border-bottom-left-radius: 8px; }
.bubble.bot { align-self: flex-end; background: #fff; border: 2px solid #f0e4e2; color: var(--dark); border-bottom-right-radius: 8px; }

.row { display: flex; flex-direction: column; align-items: center; gap: 36px; width: 100%; }
.feat { display: flex; flex-direction: column; gap: 14px; text-align: right; width: 100%; padding: 0 20px; }
.feat .it { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 800; line-height: 1.35; }
.feat .it .dot { flex: none; width: 64px; height: 64px; border-radius: 20px; background: rgba(255,111,97,.18); display: grid; place-items: center; }

.step { display: flex; align-items: center; gap: 30px; text-align: right; width: 100%; background: rgba(255,248,247,.07); border: 2px solid rgba(255,248,247,.14); border-radius: 40px; padding: 30px 36px; }
.step .n { flex: none; width: 110px; height: 110px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 60px; font-weight: 900; display: grid; place-items: center; }
.step .t { font-size: 42px; font-weight: 900; line-height: 1.35; }
.step .s { font-size: 32px; color: var(--muted); font-weight: 600; }

.contact { width: 100%; display: flex; flex-direction: column; gap: 24px; }
.contact .c { display: flex; align-items: center; gap: 28px; background: var(--cream); color: var(--dark); border-radius: 40px; padding: 28px 36px; text-align: right; }
.contact .c .ico { flex: none; width: 96px; height: 96px; border-radius: 28px; background: var(--coral); display: grid; place-items: center; }
.contact .c .t { font-size: 30px; color: #7a5c58; font-weight: 700; }
.contact .c .v { font-size: 44px; font-weight: 900; line-height: 1.3; }
.contact .c.wa .ico { background: #25d366; }

.slogan { white-space: nowrap; font-size: 84px; font-weight: 900; background: linear-gradient(90deg, var(--gold), var(--coral)); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.3; padding: 0 10px; }
.tags { font-size: 34px; color: var(--muted); font-weight: 700; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; }
.bignum { font-size: 220px; font-weight: 900; line-height: 1; background: linear-gradient(180deg, #fff, var(--coral2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Logo de l'agence (version typographique : « الو777سيط » + al777asset) */
.logo { width: 460px; height: 460px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 40px 140px rgba(255,111,97,.35), 0 0 0 14px rgba(255,255,255,.08); }
.logo .ar { font-size: 104px; font-weight: 1000; color: #111; line-height: 1; letter-spacing: -2px; }
.logo .ar b { color: #e0262d; font-style: italic; font-size: 64px; vertical-align: 26px; margin: 0 -2px; }
.logo .rule { width: 300px; height: 9px; background: #111; border-radius: 9px; margin-top: 8px; }
.logo .la { direction: ltr; font-size: 40px; font-weight: 900; font-style: italic; color: #111; margin-top: 6px; }
.logo .la b { color: #e0262d; text-decoration: underline; text-decoration-thickness: 5px; text-underline-offset: 6px; }
.logo.sm { transform-origin: center; }
.qr { width: 560px; height: 560px; border-radius: 48px; background: #F7F2E8; padding: 26px; box-shadow: 0 40px 120px rgba(0,0,0,.5), 0 0 0 10px rgba(255,111,97,.6); }
.qr img { width: 100%; height: 100%; display: block; }
.socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 18px; }
.socials span { padding: 12px 26px; border-radius: 999px; background: rgba(255,248,247,.1); border: 2px solid rgba(255,248,247,.18); font-size: 32px; font-weight: 800; direction: ltr; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="blob" id="b1"></div>
  <div class="blob" id="b2"></div>
  <div class="blob" id="b3"></div>
  <svg id="skyline" viewBox="0 0 1080 360" preserveAspectRatio="none">
    <g fill="#ff6f61">
      <rect x="0" y="210" width="90" height="150"/><rect x="100" y="150" width="70" height="210"/>
      <polygon points="180,360 180,190 240,130 300,190 300,360"/><rect x="310" y="90" width="80" height="270"/>
      <rect x="400" y="170" width="120" height="190"/><rect x="430" y="140" width="60" height="30"/>
      <path d="M540 360 V220 a60 60 0 0 1 120 0 V360 Z"/><rect x="670" y="120" width="90" height="240"/>
      <rect x="770" y="200" width="110" height="160"/><polygon points="890,360 890,180 950,120 1010,180 1010,360"/>
      <rect x="1020" y="160" width="60" height="200"/>
    </g>
  </svg>
  <div id="brandbar">
    <div class="b"><img src="../../public/icons/icon-192.png" alt=""><span>الوسيط 777</span></div>
    <div class="site">al-wasset-777.vercel.app</div>
  </div>
  <div id="scenes"></div>
  <div id="progress"></div>
</div>

<script>
// ---------- Icônes (tracés inspirés de lucide) ----------
const P = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  tag: '<path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.59-8.59a1 1 0 0 0 0-1.41z"/><circle cx="7" cy="7" r="1.5"/>',
  trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  mobile: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  spark: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
  store: '<path d="M3 9h18l-2-5H5z"/><path d="M5 9v11h14V9"/><path d="M10 20v-5h4v5"/>',
  land: '<path d="M3 20h18"/><path d="m5 20 5-9 4 6 2-3 3 6"/><circle cx="17" cy="6" r="2"/>',
  riad: '<path d="M3 21V9a9 9 0 0 1 18 0v12"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/><path d="M3 21h18"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  map: '<polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  wa: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-1.9-1-1 .8a4 4 0 0 1-2.2-2.2l.8-1-1-1.9z"/>',
};
const ic = (n, s = 56, c = '#fff', w = 2.2) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

// Mini « photo » d'un bien, dessinée en SVG (ciel + bâtiment).
const photo = (hue, kind) => {
  const sky = `<defs><linearGradient id="g${hue}${kind}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hue},70%,72%)"/><stop offset="1" stop-color="hsl(${hue + 25},80%,88%)"/></linearGradient></defs><rect width="500" height="220" fill="url(#g${hue}${kind})"/><circle cx="420" cy="60" r="30" fill="#fff6d8" opacity=".9"/>`;
  const b = kind === 'villa'
    ? '<rect x="0" y="180" width="500" height="40" fill="#7fb069"/><polygon points="130,110 250,50 370,110" fill="#c0503f"/><rect x="150" y="110" width="200" height="80" fill="#fbeee6"/><rect x="230" y="140" width="40" height="50" fill="#6b3b2e"/><rect x="170" y="125" width="40" height="30" fill="#8ec5e8"/><rect x="290" y="125" width="40" height="30" fill="#8ec5e8"/><circle cx="80" cy="160" r="30" fill="#4f8a3c"/><circle cx="430" cy="165" r="26" fill="#4f8a3c"/>'
    : kind === 'riad'
    ? '<rect x="0" y="190" width="500" height="30" fill="#d9a46c"/><rect x="110" y="70" width="280" height="130" fill="#e7b98a"/><path d="M215 200v-60a35 35 0 0 1 70 0v60z" fill="#5e3b2b"/><rect x="140" y="95" width="40" height="40" rx="20" fill="#2e6f8e"/><rect x="320" y="95" width="40" height="40" rx="20" fill="#2e6f8e"/><rect x="110" y="62" width="280" height="12" fill="#c98f5a"/>'
    : '<rect x="0" y="195" width="500" height="25" fill="#9aa5ad"/><rect x="90" y="40" width="150" height="160" fill="#f4e9e2"/><rect x="250" y="80" width="170" height="120" fill="#e9d6cc"/>' +
      [0,1,2,3].map(r => [0,1,2].map(c => `<rect x="${105 + c * 45}" y="${55 + r * 36}" width="28" height="22" fill="#86b8d6"/>`).join('')).join('') +
      [0,1,2].map(r => [0,1,2].map(c => `<rect x="${265 + c * 52}" y="${95 + r * 34}" width="32" height="20" fill="#86b8d6"/>`).join('')).join('');
  return `<svg viewBox="0 0 500 220" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">${sky}${b}</svg>`;
};

// ---------- Scènes ----------
// Chaque élément .a apparaît à data-t secondes (relatif à la scène) avec l'effet data-fx.
const A = (t, fx, html, cls = '', style = '') => `<div class="a ${cls}" data-t="${t}" data-fx="${fx}" style="${style}">${html}</div>`;
const card = (t, icon, title, sub) => A(t, 'right', `<div class="ico">${ic(icon, 64)}</div><div><div class="t">${title}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`, 'card');
const it = (t, icon, txt) => A(t, 'right', `<span class="dot">${ic(icon, 38, '#ff6f61', 2.4)}</span><span>${txt}</span>`, 'it');

const LOGO = '<div class="logo"><div class="ar">الو<b>777</b>سيط</div><div class="rule"></div><div class="la">al<b>777</b>asset</div></div>';

const SCENES = [
  // 1. Intro
  { d: 9, html: `
    <div class="ring a" data-t="0.2" data-fx="ring" style="width:620px;height:620px;top:330px;left:230px"></div>
    <div class="ring a" data-t="0.6" data-fx="ring" style="width:820px;height:820px;top:230px;left:130px"></div>
    ${A(0.3, 'pop', LOGO)}
    <div class="sp2"></div>
    ${A(1.3, 'up', '<h1 style="white-space:nowrap">مكتب <span class="hl">الوسيط 777</span></h1>')}
    ${A(2.0, 'up', '<h3>للخدمات العقارية و الإستشارات الإستثمارية</h3>')}
    <div class="sp"></div>
    ${A(2.8, 'pop', `<span class="kicker">${ic('pin', 40, '#ff9a8b')} مكناس – المغرب</span>`)}
  ` },

// ---------- Moteur de rendu déterministe ----------
const XF = 0.7; // durée du fondu entre scènes
let start = 0;
const root = document.getElementById('scenes');
const scenes = SCENES.map((s) => {
  const el = document.createElement('div');
  el.className = 'scene';
  el.innerHTML = s.html;
  root.appendChild(el);
  const items = [...el.querySelectorAll('.a')].map((n) => ({ n, t: +n.dataset.t, fx: n.dataset.fx }));
  const sc = { el, items, start, d: s.d };
  start += s.d;
  return sc;
});
const TOTAL = start;
window.TOTAL = TOTAL;

const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function fx(item, local) {
  const raw = clamp((local - item.t) / (item.fx === 'ring' ? 1.6 : 0.8));
  const p = easeOut(raw);
  const s = item.n.style;
  switch (item.fx) {
    case 'up': s.opacity = p; s.transform = `translateY(${(1 - p) * 70}px)`; break;
    case 'right': s.opacity = p; s.transform = `translateX(${(1 - p) * 140}px)`; break;
    case 'left': s.opacity = p; s.transform = `translateX(${(p - 1) * 140}px)`; break;
    case 'pop': s.opacity = clamp(raw * 2); s.transform = `scale(${0.4 + 0.6 * easeBack(raw)})`; break;
    case 'ring': s.opacity = (1 - raw) * 0.9 + (raw >= 1 ? 0.25 : 0); s.transform = `scale(${0.5 + 0.6 * p})`; break;
    default: s.opacity = p;
  }
}

window.renderAt = (t) => {
  for (const sc of scenes) {
    const local = t - sc.start;
    const visible = local > -XF && local < sc.d + XF;
    sc.el.style.display = visible ? 'flex' : 'none';
    if (!visible) continue;
    const inP = clamp((local + XF) / XF), outP = clamp((sc.d - local) / XF);
    const o = Math.min(inP, outP);
    sc.el.style.opacity = o;
    for (const it of sc.items) fx(it, local);
  }
  // Décor vivant
  const b = (id, ax, ay, sp) => document.getElementById(id).style.transform = `translate(${Math.sin(t * sp) * ax}px, ${Math.cos(t * sp * 0.8) * ay}px)`;
  b('b1', 80, 60, 0.21); b('b2', 70, 90, 0.17); b('b3', 120, 40, 0.13);
  document.getElementById('skyline').style.transform = `translateX(${Math.sin(t * 0.1) * 20}px)`;
  document.getElementById('progress').style.width = `${(t / TOTAL) * 100}%`;
};

window.renderAt(0);
if (location.search.includes('play')) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.renderAt(t % TOTAL); requestAnimationFrame(loop); };
  loop();
}
</script>
