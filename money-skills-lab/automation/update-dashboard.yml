# MODÈLE de GitHub Action (gratuite pour un dépôt privé dans la limite des minutes offertes par GitHub).
# À copier dans .github/workflows/update-dashboard.yml du dépôt money-skills-lab
# (elle ne s'exécute PAS tant qu'elle est dans le dossier automation/).
name: Mettre à jour le tableau de bord
on:
  push:
    paths: ["REVENUE.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 automation/revenue_total.py
      - name: Commit si changement
        run: |
          git config user.name "monetizer-bot"
          git config user.email "monetizer-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: total des revenus mis à jour"
          git push
