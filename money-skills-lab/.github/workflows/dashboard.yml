# Met à jour le tableau de bord chaque dimanche soir et à chaque modification
# des registres. Gratuit sur GitHub (minutes Actions incluses pour les dépôts privés).
name: Tableau de bord
on:
  schedule:
    - cron: "17 20 * * 0"
  push:
    paths: ["REVENUE.md", "SKILLS.md", "IDEAS.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 automation/update_dashboard.py
      - name: Commit si changement
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: mise à jour du tableau de bord"
            git push
          fi
